# Install the core first; add media dependencies only when video workflows need them.

[project]
name = "automedia-agent"
version = "0.2.0"
description = "Local AI operations workspace for social content research, production, and controlled publishing"
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = "MIT"
dependencies = [
    "requests>=2.28",
    "requests-toolbelt>=1.0",
    "python-dotenv>=1.0",
    "beautifulsoup4>=4.12",
    "bottle>=0.12",
    "simple-websocket-server>=0.4",
    "aiohttp>=3.9",
    "psutil>=5.9",
]

[project.optional-dependencies]
dev = [
    "build>=1.2",
    "pytest>=8.0",
]
media = [
    "moviepy>=1.0.3",
    "imageio-ffmpeg>=0.5",
]
desktop = [
    "Pillow>=10",
    "pyobjc-framework-Cocoa>=10; sys_platform == 'darwin'",
    "pyobjc-framework-Quartz>=10; sys_platform == 'darwin'",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = [
    "agent_loop",
    "agentmain",
    "ga",
    "llmcore",
    "mykey",
    "simphtml",
    "TMWebDriver",
]
include-package-data = false

[tool.setuptools.packages.find]
where = ["."]
include = [
    "ga_cli*",
    "tools*",
    "assets*",
    "skills*",
    "frontends*",
    "reflect*",
    "docs",
]
exclude = ["skills.local*"]
namespaces = true

[tool.setuptools.package-data]
"tools" = ["*/tool.json"]
"skills" = ["registry.json", "ARCHITECTURE.md"]
"assets" = ["*.json", "*.txt"]
"assets.tmwd_cdp_bridge" = ["*.json", "*.js", "*.html"]
"frontends.desktop.static" = ["*.html", "*.css", "*.js"]
"frontends.desktop.static.vendor" = ["*.js"]
"skills.hard_skills.agent_core" = ["*.md"]
"skills.hard_skills.explore_mode" = ["*.md"]
"skills.hard_skills.operate_mode" = ["*.md"]
"skills.hard_skills.perception_action" = ["*.md"]
"skills.hard_skills.research_mode" = ["*.md"]
"skills.hard_skills.xhs_interact" = ["*.md"]
"skills.hard_skills.xhs_publish" = ["*.md"]
"skills.hard_skills.xhs_manage" = ["*.md"]
"skills.hard_skills.xhs_review" = ["*.md"]
"skills.hard_skills.xhs_search" = ["*.md"]
"skills.soft_skills.git_content_creation" = ["*.md"]
"skills.soft_skills.commercial_ad_production" = ["*.md"]
"skills.soft_skills.search_anywhere" = ["*.md"]
"skills.soft_skills.xhs_edit" = ["*.md"]
"skills.soft_skills.xhs_review_prompt" = ["*.md"]
"skills.soft_skills.personal_operating_method" = ["*.md"]
"docs" = [
    "installation_zh.md",
    "CAPABILITY_MATRIX.md",
    "NEW_ACCOUNT_TEST_CONTROL.md",
    "EXECUTION_PRESENTATION.md",
    "DOCUMENTATION_MAP.md",
    "OPEN_SOURCE_DISCOVERABILITY.md",
    "PROJECT_SOURCES.md",
    "RELEASE_VALIDATION.md",
    "FRONTEND_STUDIO_DESKTOP.png",
    "FRONTEND_STUDIO_IDEAS.png",
    "EXECUTION_FEED_DESKTOP.png",
    "EXECUTION_FEED_DETAIL.png",
    "SOCIAL_PREVIEW.png",
]

[tool.setuptools.exclude-package-data]
"*" = ["__pycache__/*", "*.pyc", "*.pyo"]
"assets.tmwd_cdp_bridge" = ["config.js"]

[project.scripts]
ga = "ga_cli.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
