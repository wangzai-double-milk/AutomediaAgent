name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: pytest -q
      - run: python scripts/check_skill_graph.py
      - run: python -m build
      - name: Verify wheel contents
        run: |
          python - <<'PY'
          import glob
          import zipfile

          wheel = glob.glob("dist/*.whl")[0]
          required = {
              "agent_loop.py",
              "agentmain.py",
              "ga.py",
              "llmcore.py",
              "mykey.py",
              "TMWebDriver.py",
              "ga_cli/__main__.py",
              "ga_cli/cli.py",
              "tools/convergence.py",
              "tools/image.py",
              "tools/skill_registry.py",
              "tools/xhs_publish.py",
              "tools/xhs_test_control.py",
              "docs/CAPABILITY_MATRIX.md",
              "docs/NEW_ACCOUNT_TEST_CONTROL.md",
              "frontends/desktop/static/studio.js",
              "frontends/desktop/static/execution-feed.js",
              "assets/tools_schema.json",
              "skills/registry.json",
              "skills/soft_skills/commercial_ad_production/SKILL.md",
              "skills/hard_skills/agent_core/SKILL.md",
          }
          with zipfile.ZipFile(wheel) as archive:
              names = set(archive.namelist())
          missing = sorted(required - names)
          if missing:
              raise SystemExit(f"wheel missing required files: {missing}")
          forbidden = {"config.json", "config.js", ".env", "auth.json", "mykey.json",
                       "USER_REQUIREMENTS.md", "ACCOUNT_RESTRICTION.md",
                       "CONTINUATION.md", "DELIVERY.md", "_local", "tasks", "memory"}
          leaked = sorted(name for name in names if forbidden.intersection(name.split("/")))
          if leaked:
              raise SystemExit(f"wheel contains local files: {leaked}")
          print(f"verified {wheel}: {len(names)} files")
          PY
